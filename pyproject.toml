[project]
name = "quant-alpha-research"
version = "0.1.0"
description = "Quantitative research and alpha discovery platform"
readme = "README.md"
authors = [
    { name = "bhanuprakash2811", email = "bhanuprakashbhanu2811@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
quant-alpha-research = "quant_alpha:main"

[tool.uv.build-backend]
module-name = "quant_alpha"
module-root = "src"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
